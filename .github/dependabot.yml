# Actions are pinned to commit SHAs; Dependabot proposes the new SHA (with its version comment)
# when an action publishes a release, so the pins do not go stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for all actions, so the pins move together and CI runs once.
    groups:
      github-actions:
        patterns: ["*"]
