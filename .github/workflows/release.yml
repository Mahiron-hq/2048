name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  # From the release's SHA512-SUMS.txt; a mismatch fails the job instead of running tampered tools.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.1.0
  # Fingerprint of the release signing certificate; an APK signed with anything else is not published.
  RELEASE_CERT_SHA256: eb4210095c9919745312b83e94a3755767b764427c447b986c85e63479542fe0

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  apk:
    name: Build and publish APKs
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches the project version
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-android-templates

      - name: Download Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  /tmp/godot.zip" | sha512sum --check --strict
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the Android parts of the (1.3 GB) template bundle are needed.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA512  /tmp/templates.tpz" | sha512sum --check --strict
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/android_source.zip \
            templates/android_release.apk templates/android_debug.apk -d "$dest"
          rm /tmp/templates.tpz

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import project and install the Gradle build template
        run: |
          timeout 600 ~/godot/godot --headless --path . --import || true
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          # A lingering Gradle daemon keeps Godot's export process from exiting.
          printf '\norg.gradle.daemon=false\n' >> android/build/gradle.properties

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Export APKs
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          export_apk() {
            # Fresh Gradle intermediates per preset: switching ABIs must not reuse old outputs.
            rm -rf android/build/build
            timeout 1500 ~/godot/godot --headless --path . --export-release "$1" "$2" || true
            test -s "$2" || { echo "::error::Export of '$1' produced no file"; exit 1; }
          }
          export_apk "Android" build/2048-merge-arm64.apk
          export_apk "Android armeabi-v7a" build/2048-merge-armv7.apk

      - name: Verify APKs
        run: |
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          version=${GITHUB_REF_NAME#v}
          check() {
            "$tools/apksigner" verify --print-certs "$1" > /tmp/certs.txt
            grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" /tmp/certs.txt || {
              echo "::error::$1 is not signed with the release certificate"; exit 1; }
            "$tools/aapt2" dump badging "$1" > /tmp/badging.txt
            grep -q "versionName='$version'" /tmp/badging.txt
            grep -q "native-code: '$2'" /tmp/badging.txt
          }
          check build/2048-merge-arm64.apk arm64-v8a
          check build/2048-merge-armv7.apk armeabi-v7a
          mv build/2048-merge-arm64.apk "build/2048-Merge-${GITHUB_REF_NAME}-arm64-v8a.apk"
          mv build/2048-merge-armv7.apk "build/2048-Merge-${GITHUB_REF_NAME}-armeabi-v7a.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          (cd build && sha256sum 2048-Merge-*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/2048-Merge-${{ github.ref_name }}-*.apk

      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $GITHUB_REF_NAME" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: 2048 Merge ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            build/2048-Merge-${{ github.ref_name }}-*.apk
            build/SHA256SUMS.txt
          make_latest: true
